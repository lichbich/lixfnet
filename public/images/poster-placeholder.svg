<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad-p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0a0a0c" />
      <stop offset="50%" stopColor="#141417" />
      <stop offset="100%" stopColor="#08080a" />
    </linearGradient>
    <radialGradient id="center-glow-p" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stopColor="#27272a" stopOpacity="0.45" />
      <stop offset="55%" stopColor="#18181b" stopOpacity="0.12" />
      <stop offset="100%" stopColor="#09090b" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="ribbon-gray-l-p" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#8e8e93" />
      <stop offset="100%" stopColor="#48484a" />
    </linearGradient>
    <linearGradient id="text-grad-gray-p" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#636366" />
      <stop offset="50%" stopColor="#aeaeb2" />
      <stop offset="100%" stopColor="#636366" />
    </linearGradient>
    <!-- Subtle Film Texture Grid -->
    <pattern id="cinema-grid-p" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#27272a" stroke-width="0.8" stroke-opacity="0.18" />
    </pattern>
    <!-- Shadow Filter -->
    <filter id="logo-shadow-p" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" floodColor="#000" floodOpacity="0.8" />
    </filter>
  </defs>

  <!-- Background Base with subtle cinematic texture -->
  <rect width="600" height="900" fill="url(#bg-grad-p)" />
  <rect width="600" height="900" fill="url(#center-glow-p)" />
  <rect width="600" height="900" fill="url(#cinema-grid-p)" />

  <!-- Subtle Cinematic Inner Frame -->
  <rect x="20" y="20" width="560" height="860" rx="14" fill="none" stroke="#2c2c2e" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Center Artwork -->
  <g transform="translate(300, 420)" filter="url(#logo-shadow-p)">
    <!-- Folded Ribbon L Icon in Matte Titanium Gray (Scaled 3.0x) -->
    <g transform="translate(-30, -70) scale(3.0)">
      <!-- Back vertical ribbon base -->
      <path d="M0 0 H5.2 V24.5 C3.5 24.8 1.8 25.1 0 25.4 Z" fill="#2c2c2e" />
      <!-- Front vertical ribbon overlay -->
      <path d="M0 0 H5.2 V20.5 H0 Z" fill="#3a3a3c" />
      <!-- Horizontal bottom ribbon with 3D fold -->
      <path d="M0 19.5 H19.5 V26 C13 27 6.5 27.2 0 26.4 Z" fill="url(#ribbon-gray-l-p)" />
    </g>

    <!-- Brand Typography LIXFNET -->
    <text
      x="0"
      y="75"
      text-anchor="middle"
      fill="url(#text-grad-gray-p)"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
      font-size="36"
      font-weight="900"
      letter-spacing="8px"
    >
      LIXFNET
    </text>

    <!-- Subtitle: Image Placeholder Indicator -->
    <g transform="translate(0, 118)">
      <rect x="-95" y="-13" width="190" height="26" rx="13" fill="#1c1c1e" stroke="#2c2c2e" stroke-width="1" />
      <circle cx="-72" cy="0" r="3" fill="#48484a" />
      <text
        x="6"
        y="4"
        text-anchor="middle"
        fill="#8e8e93"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="11"
        font-weight="700"
        letter-spacing="2px"
      >
        CHƯA CÓ HÌNH BÌA
      </text>
      <circle cx="72" cy="0" r="3" fill="#48484a" />
    </g>
  </g>
</svg>
