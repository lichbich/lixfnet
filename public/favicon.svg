<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#141414"/>
  <defs>
    <filter id="ribbonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-1" dy="2" stdDeviation="2" floodColor="#000000" floodOpacity="0.8"/>
    </filter>
    <linearGradient id="ribbonDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#991217"/>
      <stop offset="100%" stopColor="#B81D24"/>
    </linearGradient>
    <linearGradient id="ribbonBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FF1824"/>
      <stop offset="100%" stopColor="#E50914"/>
    </linearGradient>
  </defs>
  <!-- Vertical Left Ribbon -->
  <path d="M15 11 H27 V48 C23 48.5 19 49.2 15 50 Z" fill="url(#ribbonDark)"/>
  <!-- Front Vertical Ribbon Overlay -->
  <path d="M15 11 H27 V42 H15 Z" fill="#B81D24"/>
  <!-- Bottom Horizontal Fold Ribbon with angle cut & drop shadow -->
  <path d="M15 39 H49 V49 C37 50.8 26 51.5 15 50.2 Z" fill="url(#ribbonBright)" filter="url(#ribbonShadow)"/>
</svg>
